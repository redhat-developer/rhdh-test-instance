auth:
  environment: production
  providers:
    oidc:
      production:
        metadataUrl: '${KEYCLOAK_METADATA_URL}'
        clientId: '${KEYCLOAK_CLIENT_ID}'
        clientSecret: '${KEYCLOAK_CLIENT_SECRET}'
        prompt: auto
        callbackUrl: '${RHDH_BASE_URL}/api/auth/oidc/handler/frame'
        signIn:
          resolvers:
            # Upstream oidc-provider (GHCR pin) exposes emailLocalPart / emailMatching
            # only. preferredUsernameMatchingUserEntityName is not in that module.
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    guest:
      dangerouslyAllowOutsideDevelopment: false
signInPage: oidc
orchestrator:
  dataIndexService:
    url: '${SONATAFLOW_DATA_INDEX_URL}'

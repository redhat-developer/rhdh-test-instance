app:
  baseUrl: '${RHDH_BASE_URL}'
  extensions:
    # Translation testing for Test Day.
    - api:app/app-language:
        config:
          availableLanguages: [en, de, es, fr, it, ja]
          defaultLanguage: en

backend:
  baseUrl: '${RHDH_BASE_URL}'
  cors:
    origin: '${RHDH_BASE_URL}'
  csp:
    connect-src:
      - "'self'"
      - 'http:'
      - 'https:'
    img-src:
      - "'self'"
      - 'data:'

auth:
  session:
    secret: '${SESSION_SECRET}'

# Public access only. A GITHUB_TOKEN, when supplied, is merged at deploy time.
integrations:
  github:
    - host: github.com

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [API, Component, User, Group, Location, Resource, System, Template]
  locations:
    - type: url
      target: https://github.com/redhat-developer/rhdh/blob/main/catalog-entities/all.yaml
    - type: url
      target: https://github.com/redhat-developer/red-hat-developer-hub-software-templates/blob/main/templates.yaml
    - type: file
      target: ./catalog-entities/components.yaml
    - type: file
      target: ./catalog-entities/operators.yaml
    - type: file
      target: ./catalog-entities/resources.yaml
    - type: file
      target: ./catalog-entities/plugins.yaml
    - type: file
      target: ./catalog-entities/topology-test.yaml

app:
  baseUrl: '${RHDH_BASE_URL}'
  # Backstage replaces arrays when config files are merged, so this list hides
  # the defaults shipped in the RHDH image's app-config.yaml unless they are
  # restated. Keep the product defaults first and add test-only entries after.
  # make verify-plugins fails if a product default goes missing.
  extensions:
    # Product default: the Backstage home page is the landing page.
    - page:home:
        config:
          path: /
    # Product default: the Backstage search plugin duplicates the RHDH homepage
    # search bar widget on 1.54.
    - home-page-widget:search/search-bar: false
    # Product defaults from the techdocs-module-addons-contrib plugin config.
    - addon:techdocs/expandable-navigation: false
    - addon:techdocs/report-issue
    - addon:techdocs/text-size: false
    - addon:techdocs/light-box: false
    # Translation testing for Test Day.
    - api:app/app-language:
        config:
          availableLanguages: [en, de, es, fr, it, ja]
          defaultLanguage: en

backend:
  baseUrl: '${RHDH_BASE_URL}'
  cors:
    origin: '${RHDH_BASE_URL}'
  csp:
    connect-src:
      - "'self'"
      - 'http:'
      - 'https:'
    img-src:
      - "'self'"
      - 'data:'

auth:
  session:
    secret: '${SESSION_SECRET}'

# Public access only. A GITHUB_TOKEN, when supplied, is merged at deploy time.
integrations:
  github:
    - host: github.com

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [API, Component, User, Group, Location, Resource, System, Template]
  locations:
    - type: url
      target: https://github.com/redhat-developer/rhdh/blob/main/catalog-entities/all.yaml
    - type: url
      target: https://github.com/redhat-developer/red-hat-developer-hub-software-templates/blob/main/templates.yaml
    - type: file
      target: ./catalog-entities/components.yaml
    - type: file
      target: ./catalog-entities/operators.yaml
    - type: file
      target: ./catalog-entities/resources.yaml
    - type: file
      target: ./catalog-entities/plugins.yaml
    - type: file
      target: ./catalog-entities/topology-test.yaml

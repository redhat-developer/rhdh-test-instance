# RHDH Helm chart values for test instances.
#
# Dynamic plugins are supplied at install time by helm/deploy.sh from the merged
# configuration (config/dynamic-plugins.yaml plus the selected plugins).
# extraAppConfig is built by helm/deploy.sh as well.

podLabels:
  backstage.io/kubernetes-id: developer-hub

# Single replica with an ephemeral dynamic-plugins volume: a rolling update
# cannot schedule the new pod while the old one holds the volume.
strategy:
  type: Recreate

extraEnvFrom:
  - secretRef:
      name: rhdh-secrets

auth:
  backend:
    existingSecretRef:
      name: rhdh-secrets
      key: BACKEND_SECRET

extraEnv:
  # Fallback only: the Segment analytics provider is disabled in
  # config/dynamic-plugins.yaml, but the plugin reads this as
  # app.analytics.segment.testMode if it is ever re-enabled.
  - name: SEGMENT_TEST_MODE
    value: 'true'
  # Cluster-pool ingress certificates are self-signed.
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: '0'

# RBAC policy and catalog entity ConfigMaps (created by setup-resources.sh).
extraVolumeMounts:
  - name: rbac-policy
    mountPath: /opt/app-root/src/rbac
  - name: catalog-entities
    mountPath: /opt/app-root/src/catalog-entities

extraVolumes:
  - name: rbac-policy
    configMap:
      defaultMode: 420
      name: rbac-policy
      # Only created when the rbac plugin is selected.
      optional: true
  - name: catalog-entities
    projected:
      sources:
        - configMap:
            name: plugins-config-map
        - configMap:
            name: operators-config-map
            optional: true
        - configMap:
            name: components-config-map
            optional: true
        - configMap:
            name: resources-config-map
            optional: true

dynamicPlugins:
  volume:
    type: ephemeral
    ephemeral:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

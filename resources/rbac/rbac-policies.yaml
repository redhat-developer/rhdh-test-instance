kind: ConfigMap
apiVersion: v1
metadata:
  name: rbac-policy
  labels:
    backstage.io/kubernetes-id: developer-hub
data:
  rbac-policy.csv: |
    p, role:default/admin, catalog-entity, read, allow
    p, role:default/admin, catalog.entity.create, create, allow
    p, role:default/admin, scorecard.metric.read, read, allow

    g, user:default/test1, role:default/admin

    p, role:default/developer, catalog-entity, read, allow
    p, role:default/developer, scorecard.metric.read, read, allow
    p, role:default/developer, intelligent-assistant.chat, use, allow
    p, role:default/developer, intelligent-assistant.notebooks, use, allow
    p, role:default/developer, intelligent-assistant.mcp.tools, use, allow
    p, role:default/developer, intelligent-assistant.skills, use, allow

    g, user:default/test2, role:default/developer

    g, user:default/test2, role:default/conditional-role
  conditional-policy.yaml: |
    result: CONDITIONAL
    roleEntityRef: 'role:default/conditional-role'
    pluginId: catalog
    resourceType: catalog-entity
    permissionMapping:
      - read
    conditions:
      rule: IS_ENTITY_OWNER
      resourceType: catalog-entity
      params:
        claims:
          - $ownerRefs

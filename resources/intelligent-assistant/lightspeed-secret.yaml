apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-secret
type: Opaque
stringData:
  # ENABLE_* settings in .env select inference.providers in lightspeed-stack.
  # This Secret supplies the runtime values consumed by those providers.

  # --- OpenAI ---
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

  # --- vLLM ---
  VLLM_URL: "${VLLM_URL}"
  VLLM_API_KEY: "${VLLM_API_KEY}"
  VLLM_MAX_TOKENS: "${VLLM_MAX_TOKENS}"
  VLLM_TLS_VERIFY: "${VLLM_TLS_VERIFY}"

  # --- Ollama ---
  OLLAMA_URL: "${OLLAMA_URL}"

  # --- Vertex AI ---
  VERTEX_AI_PROJECT: "${VERTEX_AI_PROJECT}"
  VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION}"
  GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS}"

  # --- Validation ---
  ENABLE_VALIDATION: "${ENABLE_VALIDATION}"
  VALIDATION_PROVIDER: "${VALIDATION_PROVIDER}"
  VALIDATION_MODEL_NAME: "${VALIDATION_MODEL_NAME}"

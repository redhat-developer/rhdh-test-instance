# OIDC sign-in through the shared Keycloak instance. The catalog module imports
# the realm's users and groups so RBAC and owner references resolve.
- package: ref://backstage-plugin-auth-backend-module-oidc-provider
  enabled: true
  pluginConfig:
    auth:
      environment: production
      providers:
        oidc:
          production:
            metadataUrl: "${KEYCLOAK_METADATA_URL}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            prompt: auto
            callbackUrl: "${RHDH_BASE_URL}/api/auth/oidc/handler/frame"
            signIn:
              resolvers:
                - resolver: emailLocalPartMatchingUserEntityName
        guest:
          dangerouslyAllowOutsideDevelopment: false
    signInPage: oidc
- package: ref://backstage-community-plugin-catalog-backend-module-keycloak
  enabled: true
  pluginConfig:
    catalog:
      providers:
        keycloakOrg:
          default:
            baseUrl: "${KEYCLOAK_BASE_URL}"
            loginRealm: "${KEYCLOAK_LOGIN_REALM}"
            realm: "${KEYCLOAK_REALM}"
            clientId: "${KEYCLOAK_CLIENT_ID}"
            clientSecret: "${KEYCLOAK_CLIENT_SECRET}"
            schedule:
              frequency: { minutes: 20 }
              initialDelay: { seconds: 15 }
              timeout: { minutes: 5 }

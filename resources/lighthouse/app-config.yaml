# Lighthouse reports are HTML with inline <script> blocks, served through the
# RHDH proxy (same origin), so the backend CSP must allow inline scripts.
# Kept in app-config rather than the plugin configuration: the installer rejects
# differing script-src values when several plugins define it.
backend:
  csp:
    script-src:
      - "'self'"
      - "'unsafe-eval'"
      - "'unsafe-inline'"
